<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Piss Cancer Off — 100 miles for bladder cancer research</title>
<meta name="description" content="I'm running 100 miles on January 15, 2027 to raise $10,000 for bladder cancer research. Please give what you can.">
<meta property="og:title" content="Piss Cancer Off"><meta property="og:description" content="I'm running 100 miles to piss cancer off. Every dollar goes to bladder cancer research."><meta property="og:image" content="assets/logo/stacked-light.png">
<link rel="icon" href="assets/logo/favicon-512.png"><link rel="apple-touch-icon" href="assets/logo/favicon-512.png">
<link rel="stylesheet" href="css/styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="js/pco-components.js"></script>
<script src="js/data.js"></script>
</head>
<body><div id="root"></div>
<script type="text/babel" src="js/hero.jsx"></script>
<script type="text/babel" src="js/sections.jsx"></script>
<script type="text/babel">
const { Footer } = window.PissCancerOffDesignSystem_99f843;
const D = window.PCO_DATA;
function useMobile(){ const q='(max-width: 720px)'; const [m,setM]=React.useState(()=>window.matchMedia(q).matches); React.useEffect(()=>{const mq=window.matchMedia(q); const h=e=>setM(e.matches); mq.addEventListener('change',h); return ()=>mq.removeEventListener('change',h);},[]); return m; }
function Site(){
  const mobile=useMobile();
  const [modal,setModal]=React.useState(null);
  return <>
    <Hero mobile={mobile} raised={D.raised} goal={D.goal} onDonate={setModal} />
    <Cause mobile={mobile} />
    <Why mobile={mobile} onDonate={setModal} />
    <Give mobile={mobile} onDonate={setModal} />
    <Stats mobile={mobile} stats={D.stats} raceStart={D.raceStart} strava={D.strava} instagram={D.instagram} />
    <Footer compact={mobile} logo="assets/logo/horizontal-dark.svg" charityLine={D.charityLine} venmo={D.venmo} email={D.email} style={mobile?{paddingBottom:104}:undefined} />
    {mobile && <StickyDonate onDonate={setModal} />}
    {modal==='pledge' && <PledgeModal mobile={mobile} onClose={()=>setModal(null)} />}
    {modal && modal!=='pledge' && <DonateModal mode={modal} mobile={mobile} onClose={()=>setModal(null)} />}
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Site />);
</script></body></html>
